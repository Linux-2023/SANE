# 双臂遥操作配置文件
# 每个机械臂有独立的配置

# ==================== 左臂配置 ====================
left_arm:
  # 机器人序列号
  robot_sn: "Rizon4s-063215"
  # 夹爪名称 (留空则不启用夹爪)
  gripper_name: "Flexiv-GN01"
  
  # T265 相机序列号 (可通过 rs-enumerate-devices 查看)
  # 留空则自动选择第一个可用的 T265
  t265_serial: "121222110260"
  
  # 编码器串口
  encoder_port: "/dev/ttyUSB0"
  # 编码器方向: 1 表示编码器增加=张开, -1 表示编码器增加=闭合
  encoder_direction: 1
  # 编码器角度倍率
  encoder_scale: 2.0
  
  # 初始关节角度 (度), 启动后机械臂会先移动到这个位置
  init_joints_deg: [-6.78, 46.79, 8.76, 67.47, 93.46, 2.01, -22.59]
  
# ==================== 右臂配置 ====================
right_arm:
  # 机器人序列号
  robot_sn: "Rizon4s-063239"  # 请替换为实际序列号
  # 夹爪名称 (留空则不启用夹爪)
  gripper_name: "Flexiv-GN01"
  
  # T265 相机序列号 (可通过 rs-enumerate-devices 查看)
  # 留空则自动选择第二个可用的 T265
  t265_serial: "132222111217"
  
  # 编码器串口
  encoder_port: "/dev/ttyUSB1"
  # 编码器方向
  encoder_direction: -1
  # 编码器角度倍率
  encoder_scale: 2.0
  
  # 初始关节角度 (度)
  init_joints_deg: [8.84, -44.50, -13.61, -82.2, 86.35,8.2, 40.83]

# ==================== 通用控制参数 ====================
control:
  # 控制频率 (Hz)
  frequency: 20.0
  # 位置映射缩放比例
  position_scale: 1
  
  # 滤波参数
  # 姿态最大响应增益 (0.0-1.0)，越大越灵敏
  alpha: 0.8
  # 姿态死区阈值 (度)
  rot_deadband_deg: 1.0
  # 姿态快速响应阈值 (度)
  rot_fullspeed_deg: 8.0
  # 姿态最小响应增益
  rot_alpha_min: 0.05
  # 位置死区阈值 (mm)
  pos_deadband_mm: 1.0
  # 位置快速响应阈值 (mm)
  pos_fullspeed_mm: 10.0
  # 位置最小响应增益
  pos_alpha_min: 0.05
  # 位置最大响应增益
  pos_alpha_max: 0.6
  
  # 初始化关节运动超时 (秒)
  init_joints_timeout: 60.0

# ==================== 碰撞检测配置 ====================
collision:
  # 是否启用碰撞检测
  enabled: true
  # 安全距离阈值 (米)
  # - 设置为 0: 仅检测是否真正碰撞（更快，无安全裕度）
  # - 设置为正值 (如 0.03): 当双臂最小距离小于此值时拒绝运动命令
  # 建议值: 0 (仅碰撞检测) 或 0.03-0.05 (3-5cm 安全距离)
  safety_threshold: 0

